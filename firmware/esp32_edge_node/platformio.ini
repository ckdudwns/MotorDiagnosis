[platformio]
default_envs = esp32-s3-devkitc-1-n8

; Actual deployment target: 8 MB flash, no PSRAM dependency.
[env:esp32-s3-devkitc-1-n8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
build_flags = -DCONTINUOUS_VIBRATION_ENABLED=1 -DRAW_VIBRATION_ENABLED=1
lib_deps =
    kosme/arduinoFFT
    bblanchon/ArduinoJson @ ^7.0.0

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    kosme/arduinoFFT
    bblanchon/ArduinoJson @ ^7.0.0

; Opt-in: enlarged persistent raw spool; no PSRAM. NOT an in-place OTA update.
; Existing LittleFS must be backed up before changing partition offsets.
[env:esp32-s3-devkitc-1-n8-adaptive]
extends = env:esp32-s3-devkitc-1-n8
board_build.partitions = partitions_adaptive_8MB.csv
build_flags = ${env:esp32-s3-devkitc-1-n8.build_flags} -DADAPTIVE_TRANSMISSION_ENABLED=1



; ============================================================
; Native unit-test environment
; Append this block to firmware/esp32_edge_node/platformio.ini
; ============================================================

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -DUNITY_INCLUDE_DOUBLE

; Build only the pure firmware logic for host-side tests.
; Do NOT compile Arduino main.cpp in the native environment.
build_src_filter =
    +<firmware_logic.cpp>
    +<device_health.cpp>
    +<remote_config.cpp>
    +<communication_quality.cpp>
    +<edge_analysis.cpp>
    +<vibration_window.cpp>

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
