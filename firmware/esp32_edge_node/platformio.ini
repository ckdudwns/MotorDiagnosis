[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    kosme/arduinoFFT
    bblanchon/ArduinoJson @ ^7.0.0



; ============================================================
; Native unit-test environment
; Append this block to firmware/esp32_edge_node/platformio.ini
; ============================================================

[env:native]
platform = native
test_framework = unity
test_build_src = yes

; Build only the pure firmware logic for host-side tests.
; Do NOT compile Arduino main.cpp in the native environment.
build_src_filter =
    +<firmware_logic.cpp>
    +<device_health.cpp>
    +<remote_config.cpp>

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
